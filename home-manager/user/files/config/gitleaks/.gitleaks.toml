# Global gitleaks configuration
# https://github.com/gitleaks/gitleaks#configuration
#
# Add allowlist entries here for known false positives, e.g.:
#
# [allowlist]
# paths = [
#     '''some/path/to/ignore''',
# ]
# commits = [
#     '''abc123deadbeef''',
# ]

title = "global gitleaks config"

# Load gitleaks' built-in ruleset. Without this, a supplied --config with no
# rules scans with an empty ruleset and never flags anything.
[extend]
useDefault = true
